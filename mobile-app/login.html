<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sidekick AI - Login</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="css/otp.css">
    <link rel="stylesheet" href="css/legal.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/travel-map.css">
    <link rel="stylesheet" href="css/a11y.css">
    <link rel="stylesheet" href="css/dark.css">
    <script src="js/theme-init.js"></script>
</head>
<body data-map-stop="login">
    <div class="app-container">
        <div class="screen register-screen">
            <div class="header" data-theme-toggle>
                <a href="index.html" class="back-btn" aria-label="Back to welcome screen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </a>
            </div>
            
            <div class="content" data-map-slide>
                <h1 class="screen-title">Welcome back</h1>
                <p class="screen-subtitle">Login to continue your journey</p>
                
                <form class="form" id="login-form" data-map-step="login">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="your@email.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    
                    <a href="#" class="forgot-link">Forgot password?</a>
                    
                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                    <div class="google-auth">
                        <div class="google-auth-divider" aria-hidden="true"><span>or</span></div>
                        <button type="button" class="google-btn" data-google-signin><svg class="google-btn-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.94 23.94 0 0 0 0 24c0 3.77.9 7.35 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Continue with Google</span></button>
                        <p class="google-auth-note">By continuing with Google, you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a> and confirm you are 18 or older.</p>
                    </div>
                </form>

                <section class="form reset-flow" id="reset-flow" hidden>
                    <div class="reset-step" id="reset-step-email" data-map-step="reset-email">
                        <div class="form-group">
                            <label for="reset-email">Email</label>
                            <input type="email" id="reset-email" placeholder="your@email.com" autocomplete="email">
                        </div>
                        <button type="button" class="btn btn-primary btn-full" id="reset-send-code">Send code</button>
                    </div>

                    <div class="reset-step" id="reset-step-code" data-map-step="reset-code" hidden>
                        <p class="reset-text">Enter the 6-digit code sent to <strong id="reset-code-email"></strong>.</p>
                        <div class="form-group">
                            <label for="reset-otp">Reset code</label>
                            <input type="text" id="reset-otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-otp-boxes>
                        </div>
                        <button type="button" class="btn btn-primary btn-full" id="reset-verify-code">Confirm code</button>
                        <div class="reset-secondary">
                            <button type="button" class="reset-link-button" id="reset-resend-code">Resend code</button>
                            <button type="button" class="reset-link-button" id="reset-change-email">Change email</button>
                        </div>
                    </div>

                    <div class="reset-step" id="reset-step-password" data-map-step="reset-password" hidden>
                        <div class="form-group">
                            <label for="reset-password">Enter new password</label>
                            <input type="password" id="reset-password" placeholder="Letters and numbers, 8+ characters" autocomplete="new-password">
                        </div>
                        <div class="form-group">
                            <label for="reset-password-confirm">Confirm new password</label>
                            <input type="password" id="reset-password-confirm" placeholder="Type it again" autocomplete="new-password">
                        </div>
                        <button type="button" class="btn btn-primary btn-full" id="reset-save-password">Change password</button>
                    </div>

                    <button type="button" class="reset-link-button reset-back" id="reset-back-to-login">Back to login</button>
                </section>

                <div class="auth-error" id="auth-error" role="alert" aria-live="polite" hidden></div>
                <div class="auth-error auth-success" id="auth-status" role="status" aria-live="polite" hidden></div>
                
                <div class="footer-text">
                    <span>Don't have an account? </span>
                    <a href="register.html">Register</a>
                </div>
                <nav class="legal-links" aria-label="Legal">
                    <a href="privacy.html">Privacy Policy</a>
                    <a href="terms.html">Terms</a>
                    <a href="cookies.html">Cookie &amp; Storage Notice</a>
                </nav>
            </div>
        </div>
    </div>

    <script src="js/config.local.js"></script>
    <script src="js/core.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/otp-input.js"></script>
    <script src="js/login.js"></script>
    <script src="js/google-auth.js"></script>
    <script src="js/forgot-password.js"></script>
    <script src="js/travel-map.js"></script>
</body>
</html>
