<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sidekick AI - Chat</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/app-rating.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/tab-motion.css">
    <link rel="stylesheet" href="css/a11y.css">
    <link rel="stylesheet" href="css/dark.css">
    <script src="js/theme-init.js"></script>
</head>
<body data-tab="chat">
    <div class="app-container">
        <div class="screen chat-screen">
            <div class="chat-header">
                <div class="chat-header-info">
                    <h1>Sidekick</h1>
                    <p class="chat-ai-note">AI replies can be wrong. Check important details.</p>
                </div>
                <div class="chat-menu">
                    <button type="button" class="chat-menu-btn" id="chat-menu-btn" aria-label="Chat options" aria-haspopup="menu" aria-expanded="false" aria-controls="chat-menu-list">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg>
                    </button>
                    <div class="chat-menu-list" id="chat-menu-list" role="menu" hidden>
                        <button type="button" role="menuitem" data-chat-menu="archive">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"></rect><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"></path><path d="M10 13h4"></path></svg>
                            Chat archive
                        </button>
                        <button type="button" role="menuitem" class="is-danger" data-chat-menu="delete">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6M14 11v6"></path><path d="M9 6V4h6v2"></path></svg>
                            Delete this chat
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <!-- Messages injected by JS -->
            </div>
            
            <div class="chat-input-container">
                <input type="text" id="chat-input" placeholder="Message Sidekick" aria-label="Message Sidekick" onkeypress="handleKeyPress(event)">
                <button type="button" class="send-btn" onclick="onSendButtonClick()" aria-label="Send message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            
        </div>
    </div>

    <nav class="bottom-nav overlay">
                <a href="dashboard.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                    <span>Home</span>
                </a>
                <a href="itinerary.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span>Itinerary</span>
                </a>
                <a href="chat.html" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                    <span>Sidekick</span>
                </a>
                <a href="alerts.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span>Alerts</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Profile</span>
                </a>
    </nav>

    <script src="js/config.local.js"></script>
    <script src="js/core.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app-rating.js"></script>
    <script src="js/chat-planner.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/tab-motion.js"></script>
    <script src="js/pull-refresh.js"></script>
</body>
</html>
