<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sidekick AI - Itinerary</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/itinerary.css">
    <link rel="stylesheet" href="css/app-rating.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/tab-motion.css">
    <link rel="stylesheet" href="css/a11y.css">
</head>
<body data-tab="itinerary">
    <div class="app-container">
        <div class="screen itinerary-screen">
            <div class="itinerary-header">
                <div class="header-top">
                    <a href="dashboard.html" class="back-btn" aria-label="Back to home">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <h1>My Itinerary</h1>
                    <button id="show-builder" class="btn btn-outline" type="button">Customize</button>
                    <button id="remove-all-itinerary" class="btn btn-ghost" type="button" aria-label="Remove all itinerary activities" title="Remove all itinerary activities">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg>
                    </button>
                </div>
                <p id="itinerary-monitoring-status" class="itinerary-budget-note" role="status" aria-live="polite" hidden></p>
                <div id="itinerary-edit-bar" class="itinerary-edit-bar" hidden>
                    <strong id="itinerary-title-text" class="itinerary-title-text"></strong>
                    <div class="itinerary-edit-actions">
                        <button id="itinerary-rename-btn" class="itinerary-edit-chip" type="button">Rename</button>
                        <button id="itinerary-shift-btn" class="itinerary-edit-chip" type="button">Change dates</button>
                        <button id="itinerary-add-btn" class="itinerary-edit-chip primary" type="button">+ Add activity</button>
                    </div>
                </div>
                <div class="itinerary-date">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span id="itinerary-date">Choose your trip dates</span>
                </div>
                <div id="itinerary-builder" style="padding:12px 24px 8px; border-bottom:1px solid #F3F4F6; display:none; gap:8px;">
                    <div class="itinerary-builder-fields">
                        <div class="itinerary-field itinerary-field-destination">
                            <label for="itinerary-destination">Destination</label>
                            <input id="itinerary-destination" type="text" maxlength="180" placeholder="Search tourist places" required role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="itinerary-destination-suggestions" />
                            <div id="itinerary-destination-suggestions" class="destination-suggestions" role="listbox" hidden></div>
                            <div class="destination-suggestions-attribution" hidden><img src="https://maps.gstatic.com/mapfiles/api-3/images/google4.png" alt="Google" /></div>
                        </div>
                        <div class="itinerary-field"><label for="itinerary-origin">Starting location (optional)</label><input id="itinerary-origin" type="text" maxlength="180" placeholder="City or address for travel estimate" autocomplete="street-address" /></div>
                        <div class="itinerary-field"><label for="itinerary-start">Start date</label><input id="itinerary-start" type="date" required /></div>
                        <div class="itinerary-field"><label for="itinerary-end">End date</label><input id="itinerary-end" type="date" required /></div>
                        <div class="itinerary-field"><label for="itinerary-budget">Total budget (PHP)</label><input id="itinerary-budget" type="number" min="1" step="1" inputmode="numeric" placeholder="Enter your budget" aria-label="Total trip budget in Philippine pesos" /></div>
                        <button id="build-itinerary" class="btn btn-primary">Build Itinerary</button>
                    </div>
                </div>
                <details id="itinerary-place-search" class="itinerary-place-search">
                    <summary>Explore places</summary>
                    <div class="itinerary-place-search-content">
                        <input id="place-search" placeholder="Search places" aria-label="Search places" />
                        <div id="itinerary-map" class="itinerary-map" aria-label="Map of searched places"></div>
                        <div id="map" class="itinerary-place-results" aria-live="polite"></div>
                    </div>
                </details>
            </div>
            
            <details id="stay-eat" class="stay-eat">
                <summary>
                    <span class="stay-eat-summary-title">Recommended hotels &amp; restaurants</span>
                    <span id="stay-eat-summary-stay" class="stay-eat-summary-stay"></span>
                </summary>
                <div class="stay-eat-body">
                    <p id="stay-eat-area" class="stay-eat-area">Enter a destination and budget to see places that fit, best rated first.</p>
                    <p id="stay-eat-rates-note" class="stay-eat-rates-note" role="status" aria-live="polite" hidden></p>
                    <div id="stay-eat-banner" class="stay-eat-banner" hidden></div>
                    <div class="stay-eat-tabs" role="tablist">
                        <button type="button" class="stay-eat-tab active" role="tab" aria-selected="true" data-kind="hotels">Hotels</button>
                        <button type="button" class="stay-eat-tab" role="tab" aria-selected="false" data-kind="restaurants">Restaurants</button>
                    </div>
                    <p id="stay-eat-status" class="stay-eat-status" role="status" aria-live="polite"></p>
                    <div id="stay-eat-list" class="stay-eat-list" role="list"></div>
                    <button id="stay-eat-more" class="btn btn-outline stay-eat-more" type="button" hidden>Show more</button>
                    <p class="data-attribution">Places, photos and ratings from Google Maps.</p>
                </div>
            </details>

            <section id="itinerary-budget-summary" class="itinerary-budget-summary" aria-live="polite" hidden></section>
            <div class="itinerary-content" id="itinerary-content">
                <!-- Empty by default. Users build an itinerary using the builder above. -->
                <div id="no-itinerary-message" style="padding:24px;color:#6B7280">Your itinerary will appear here.</div>
                <button class="add-activity-btn" id="add-activity-btn" type="button" style="display:none">+ Add Activity</button>
            </div>
            
        </div>
    </div>

    <nav class="bottom-nav overlay">
                <a href="dashboard.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                    <span>Home</span>
                </a>
                <a href="itinerary.html" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span>Itinerary</span>
                </a>
                <a href="chat.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                    <span>Sidekick</span>
                </a>
                <a href="alerts.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span>Alerts</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Profile</span>
                </a>
    </nav>

    <script src="js/config.local.js"></script>
    <script src="js/core.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app-rating.js"></script>
    <script src="js/itinerary.js"></script>
    <script src="js/budget-pickers.js"></script>
    <script src="js/itinerary-edit.js"></script>
    <script src="js/stay-eat.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/tab-motion.js"></script>
</body>
</html>
