<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sidekick AI - Profile</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/app-rating.css">
    <link rel="stylesheet" href="css/a11y.css">
</head>
<body>
    <div class="app-container">
        <div class="screen">
            <div class="header-section">
                <h1 class="screen-title">Profile</h1>
                <p class="screen-subtitle">Manage your account</p>
            </div>

            <div class="content">
                <div class="profile-card">
                    <div style="display:flex;align-items:center;gap:12px;">
                        <div style="width:56px;height:56px;border-radius:12px;background:#F5F7FA;display:flex;align-items:center;justify-content:center;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <div>
                            <h3 id="user-name">Traveler</h3>
                            <p id="user-email" style="color:#6B7280;font-size:14px;">you@example.com</p>
                        </div>
                    </div>

                    <div style="margin-top:20px;">
                        <a href="settings.html" class="btn btn-outline btn-full" style="text-decoration:none;">Open Settings</a>
                    </div>

                    <div style="margin-top:12px;">
                        <button id="logout-btn" class="btn btn-primary btn-full">Logout</button>
                    </div>
                </div>

                <section class="profile-review-card" aria-labelledby="profile-review-heading">
                    <h2 id="profile-review-heading">Rate Sidekick</h2>
                    <p class="profile-review-summary" id="app-review-summary">Loading app ratings…</p>
                    <p class="profile-review-help">Your feedback helps us improve the app. You can update your rating any time.</p>
                    <div class="app-rating-stars profile-rating-stars" role="group" aria-label="Choose a rating from 1 to 5 stars">
                        <button type="button" data-profile-rating="1" aria-label="1 star" aria-pressed="false">★</button>
                        <button type="button" data-profile-rating="2" aria-label="2 stars" aria-pressed="false">★</button>
                        <button type="button" data-profile-rating="3" aria-label="3 stars" aria-pressed="false">★</button>
                        <button type="button" data-profile-rating="4" aria-label="4 stars" aria-pressed="false">★</button>
                        <button type="button" data-profile-rating="5" aria-label="5 stars" aria-pressed="false">★</button>
                    </div>
                    <p class="profile-rating-value" id="profile-rating-value">Select a star rating</p>
                    <label for="profile-app-review">Your review (optional)</label>
                    <textarea id="profile-app-review" maxlength="2000" rows="4" placeholder="Tell us what you think about Sidekick"></textarea>
                    <button id="profile-review-submit" class="btn btn-primary btn-full" type="button" disabled>Submit rating</button>
                    <p class="profile-review-status" id="profile-review-status" role="status" aria-live="polite"></p>
                </section>
            </div>

        </div>
    </div>

    <nav class="bottom-nav overlay">
                <a href="dashboard.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                    <span>Home</span>
                </a>
                <a href="itinerary.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span>Itinerary</span>
                </a>
                <a href="chat.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Sidekick</span>
                </a>
                <a href="alerts.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span>Alerts</span>
                </a>
                <a href="profile.html" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Profile</span>
                </a>
    </nav>

    <script src="js/config.local.js"></script>
    <script src="js/core.js"></script>
    <script src="js/app-rating.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
