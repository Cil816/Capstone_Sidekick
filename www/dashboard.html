<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sidekick AI - Dashboard</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="app-container">
        <div class="screen dashboard-screen">
            <div class="header-section">
                <h1 class="screen-title">Hello, <span id="user-name">Traveler</span></h1>
                <p class="screen-subtitle">Where do you want to go today?</p>
            </div>
            
            <div class="search-section">
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="destination-search" placeholder="Search destinations...">
                </div>
            </div>
            
            <div class="section">
                <div class="section-header">
                    <h2>Recommended for you</h2>
                    <a href="#" class="see-all">See all</a>
                </div>
                
                <div class="horizontal-scroll" id="recommended-row"></div>
            </div>
            
            <div class="section">
                <div class="section-header">
                    <h2>Popular destinations</h2>
                    <a href="#" class="see-all">See all</a>
                </div>
                
                <div class="grid-2" id="destinations-grid"></div>
            </div>
            
            <a href="chat.html" class="floating-chat-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </a>

            <div id="destination-modal" class="destination-modal" aria-hidden="true">
                <div class="destination-modal-backdrop" data-close-modal="1"></div>
                <div class="destination-modal-panel" role="dialog" aria-modal="true" aria-labelledby="destination-title">
                    <div class="destination-modal-header">
                        <h3 id="destination-title">Destination</h3>
                        <button id="destination-close" class="destination-close-btn" type="button" aria-label="Close destination details">×</button>
                    </div>
                    <div id="destination-image" class="destination-image" aria-label="Destination photo"></div>
                    <p id="destination-subtitle" class="destination-subtitle"></p>
                    <div id="destination-tags" class="destination-tags"></div>
                    <div id="destination-map" class="destination-map">Map loading...</div>
                    <div class="destination-meta-grid">
                        <div class="meta-card">
                            <span class="meta-label">How to get there</span>
                            <strong id="destination-route-mode">Calculating...</strong>
                        </div>
                        <div class="meta-card">
                            <span class="meta-label">Travel time</span>
                            <strong id="destination-route-time">Calculating...</strong>
                        </div>
                        <div class="meta-card">
                            <span class="meta-label">Distance</span>
                            <strong id="destination-route-distance">Calculating...</strong>
                        </div>
                        <div class="meta-card">
                            <span class="meta-label">Estimated budget</span>
                            <strong id="destination-route-cost">Calculating...</strong>
                        </div>
                    </div>
                    <div class="destination-actions">
                        <button id="destination-generate" class="btn btn-primary" type="button">Generate itinerary for this place</button>
                        <button id="destination-ask-ai" class="btn btn-outline" type="button">Ask AI</button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <nav class="bottom-nav overlay">
                <a href="dashboard.html" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                    <span>Home</span>
                </a>
                <a href="itinerary.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span>Itinerary</span>
                </a>
                <a href="chat.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Chat</span>
                </a>
                <a href="alerts.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span>Alerts</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Profile</span>
                </a>
    </nav>

    <script src="js/core.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
