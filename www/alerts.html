<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sidekick — Alerts</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .alerts { padding: 20px; }
    .reminders { display:flex; flex-direction:column; gap:10px; margin-top:12px }
    .reminder { padding:12px; border-radius:10px; background:#fff; border:1px solid #eee; display:flex; justify-content:space-between; align-items:center }
    .reminder .meta { font-size:13px; color:#6b7280 }
    input, select { padding:8px; border-radius:8px; border:1px solid #E5E7EB }
    .btn { padding:8px 12px }
    .settings-shortcut { margin-top: 20px; padding: 12px; border: 1px solid #E5E7EB; border-radius: 12px; background: #F9FAFB; }
    .editor-panel { margin-top: 16px; padding: 14px; border: 1px solid #E5E7EB; border-radius: 12px; background: #F9FAFB; display: none; }
    .editor-panel-title { font-weight: 600; color: #111827; }
    .editor-panel-note { margin-top: 4px; color: #6B7280; font-size: 13px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="screen">
      <div class="header">
        <a href="dashboard.html" class="back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </a>
      </div>
      <div class="content alerts">
        <h1 class="screen-title">Alerts & Reminders</h1>
        <p class="screen-subtitle">Create reminders for schedules, bookings, and advisories.</p>

        <div style="margin-top:20px">
          <input id="title" placeholder="Reminder title" />
          <div class="form-row" style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap">
            <input id="datetime" type="datetime-local" style="flex:1; min-width:150px" />
            <select id="type" style="flex:0 0 auto"><option>Schedule</option><option>Booking</option><option>Advisory</option></select>
            <button id="add" class="btn btn-primary">Add</button>
            <button id="sync-itinerary" class="btn btn-outline" type="button">Sync from Itinerary</button>
          </div>
        </div>

        <div id="itinerary-editor" class="editor-panel">
          <div id="itinerary-editor-title" class="editor-panel-title">Edit itinerary schedule</div>
          <div id="itinerary-editor-note" class="editor-panel-note"></div>
          <div class="form-row" style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap">
            <input id="itinerary-editor-datetime" type="datetime-local" style="flex:1; min-width:170px" />
            <button id="save-itinerary-edit" class="btn btn-primary" type="button">Save schedule</button>
            <button id="cancel-itinerary-edit" class="btn btn-outline" type="button">Cancel</button>
          </div>
        </div>

        <div class="reminders" id="reminders" style="margin-top:20px"></div>

        <div class="settings-shortcut" style="display:flex;justify-content:flex-end;">
          <a href="settings.html" class="btn btn-outline" style="text-decoration:none;">Notification Settings</a>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav overlay">
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      </svg>
      <span>Home</span>
    </a>
    <a href="itinerary.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>Itinerary</span>
    </a>
    <a href="chat.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>Sidekick</span>
    </a>
    <a href="alerts.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span>Alerts</span>
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="js/config.local.js"></script>
  <script src="js/core.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
