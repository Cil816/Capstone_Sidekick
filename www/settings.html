<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sidekick AI - Settings</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <div class="app-container">
    <div class="screen">
      <div class="header">
        <a href="profile.html" class="back-btn" aria-label="Back to profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </a>
      </div>

      <div class="content settings-content">
        <h1 class="screen-title">Settings</h1>
        <p class="screen-subtitle">Control reminders and account actions for your device.</p>

        <section class="settings-card settings-card-featured">
          <div class="settings-card-head">
            <h2>Notifications</h2>
            <span class="settings-chip">Mobile</span>
          </div>
          <label class="setting-row">
            <div>
              <span class="setting-title">Enable reminders</span>
              <small>Turn all alerts on or off</small>
            </div>
            <input type="checkbox" id="pref-enabled" class="toggle-input" />
          </label>
          <label class="setting-row">
            <div>
              <span class="setting-title">Sound</span>
              <small>Play a reminder tone in-app</small>
            </div>
            <input type="checkbox" id="pref-sound" class="toggle-input" />
          </label>
          <label class="setting-row">
            <div>
              <span class="setting-title">Vibration</span>
              <small>Vibrate when a reminder fires</small>
            </div>
            <input type="checkbox" id="pref-vibration" class="toggle-input" />
          </label>
        </section>

        <section class="settings-card">
          <h2>Travel Data</h2>
          <button id="sync-reminders-btn" class="btn btn-outline btn-full settings-action" type="button">Sync reminders from itinerary</button>
          <button id="clear-chat-btn" class="btn btn-outline btn-full settings-action" type="button">Clear chat history</button>
          <button id="clear-itinerary-btn" class="btn btn-outline btn-full settings-action" type="button">Remove itinerary</button>
          <button id="reset-prefs-btn" class="btn btn-outline btn-full settings-action" type="button">Reset onboarding preferences</button>
        </section>

        <section class="settings-card danger">
          <h2>Account</h2>
          <button id="logout-btn" class="btn btn-primary btn-full settings-action" type="button">Logout</button>
        </section>

        <div id="settings-message" class="settings-message" hidden></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav overlay">
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      </svg>
      <span>Home</span>
    </a>
    <a href="itinerary.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>Itinerary</span>
    </a>
    <a href="chat.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>Sidekick</span>
    </a>
    <a href="alerts.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span>Alerts</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="js/config.local.js"></script>
  <script src="js/core.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
