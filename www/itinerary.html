<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sidekick AI - Itinerary</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/itinerary.css">
</head>
<body>
    <div class="app-container">
        <div class="screen itinerary-screen">
            <div class="itinerary-header">
                <div id="itinerary-builder" style="padding:12px 24px 8px; border-bottom:1px solid #F3F4F6; display:none; gap:8px;">
                    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                        <label style="font-size:14px;color:#374151">Start date</label>
                        <input id="itinerary-start" type="date" />
                        <label style="font-size:14px;color:#374151">Budget</label>
                        <select id="itinerary-budget">
                            <option value="Budget-Friendly">Budget-Friendly</option>
                            <option value="Mid-Range">Mid-Range</option>
                            <option value="Luxury">Luxury</option>
                            <option value="Ultra Luxury">Ultra Luxury</option>
                        </select>
                        <button id="build-itinerary" class="btn btn-primary">Build Itinerary</button>
                        <button id="show-builder" class="btn btn-outline" type="button">Customize</button>
                    </div>
                    <div style="margin-top:8px; display:flex; gap:8px; flex-direction:column;">
                        <input id="place-search" placeholder="Search places (requires Google Maps API)" style="padding:10px;border-radius:10px;border:1px solid #E5E7EB;" />
                        <div id="map" style="height:160px;border-radius:8px;overflow:hidden;border:1px solid #E5E7EB"></div>
                        <small style="color:#6b7280">Tip: select a place on the map to attach coordinates to added activities.</small>
                    </div>
                    <div id="preferred-places" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px"></div>
                </div>
                <div class="header-top">
                    <a href="dashboard.html" class="back-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <h1>My Itinerary</h1>
                    <button id="remove-all-itinerary" class="btn btn-ghost" style="margin-left:auto;padding:8px 10px">Remove All</button>
                </div>
                <div class="itinerary-date">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span id="itinerary-date">Loading your dates...</span>
                </div>
            </div>
            
            <div class="itinerary-content" id="itinerary-content">
                <!-- Empty by default. Users build an itinerary using the builder above. -->
                <div id="no-itinerary-message" style="padding:24px;color:#6B7280">You don't have an itinerary yet. Use the builder above to create one.</div>
                <button class="add-activity-btn" id="add-activity-btn" type="button" style="display:none">+ Add Activity</button>
            </div>
            
        </div>
    </div>

    <nav class="bottom-nav overlay">
                <a href="dashboard.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                    <span>Home</span>
                </a>
                <a href="itinerary.html" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span>Itinerary</span>
                </a>
                <a href="chat.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Sidekick</span>
                </a>
                <a href="alerts.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span>Alerts</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Profile</span>
                </a>
    </nav>

    <script src="js/core.js"></script>
    <script src="js/itinerary.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
